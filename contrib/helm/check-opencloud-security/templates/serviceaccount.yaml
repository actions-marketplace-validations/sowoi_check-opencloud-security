{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "check-opencloud-security.serviceAccountName" . }}
  labels:
    {{- include "check-opencloud-security.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither workload reads the Kubernetes API, and both mount no token.
automountServiceAccountToken: false
{{- end }}
