{{- if .Values.scanService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "check-opencloud-security.fullname" . }}-scanner
  labels:
    {{- include "check-opencloud-security.labels" . | nindent 4 }}
    app.kubernetes.io/component: scan-service
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.scanService.replicas }}
  selector:
    matchLabels:
      {{- include "check-opencloud-security.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scan-service
  template:
    metadata:
      labels:
        {{- include "check-opencloud-security.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scan-service
        {{- with .Values.scanService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.scanService.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "check-opencloud-security.serviceAccountName" .) }}
      serviceAccountName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.scanService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scanService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scanService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scanner
          image: {{ include "check-opencloud-security.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["check-opencloud-scanner"]
          args:
            - serve
            - --port={{ .Values.scanService.port }}
            - --cache-ttl={{ .Values.scanService.cacheTtl }}
            {{- range .Values.scanService.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.scanService.port }}
          env:
            # Without a token every endpoint is open to anyone who can reach
            # the pod, and the scanner will scan any host they name.
            - name: COS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "scanService.existingSecret must name the Secret holding the service token: an untokened scan service will scan any host its callers name" .Values.scanService.existingSecret }}
                  key: {{ .Values.scanService.tokenKey }}
            {{- with .Values.scanService.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.scanService.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # /healthz needs no token, which is what makes it usable as a probe.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.scanService.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "check-opencloud-security.fullname" . }}-scanner
  labels:
    {{- include "check-opencloud-security.labels" . | nindent 4 }}
    app.kubernetes.io/component: scan-service
  {{- with .Values.scanService.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.scanService.service.type }}
  selector:
    {{- include "check-opencloud-security.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scan-service
  ports:
    - name: http
      port: {{ .Values.scanService.service.port }}
      targetPort: http
{{- end }}
