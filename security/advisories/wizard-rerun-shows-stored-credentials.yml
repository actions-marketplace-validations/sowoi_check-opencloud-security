# A security advisory record. See AGENTS.md, "Security advisories".
#
# One file per bullet under a `### Security` heading in CHANGELOG.md.
# `state` is the decision; `verified` is the evidence it rests on.

slug: wizard-rerun-shows-stored-credentials
state: declined
changelog_version: "1.22.6"
changelog_entry: "The Docker setup wizard no longer shows a stored credential when it is run again."
shipped: true
declined_because: |
  Hardening. The value is printed only to the operator re-running the wizard
  against their own deployment, and it is read from a `.env` that wizard
  itself created owner-readable - so the person who sees it already holds it,
  and nothing crosses a privilege boundary. What the fix narrows is where the
  credential ends up afterwards: a terminal scrollback, a screen share, a
  recorded session. That is worth closing, but it is not something an
  operator on an older release needs to be told to upgrade away from.
summary: >-
  The Docker setup wizard printed the credentials it read back from .env as
  the default answer when run a second time
verified: |
  git show v1.13.0:docker/setup-wizard.py | grep -n 'shown = _format_default'
  git show v1.22.5:docker/setup-wizard.py | grep -n 'shown = _format_default\|def _read_existing_env'
  Both show `shown = _format_default(self.current(question.key))` feeding the
  `[{shown}] > ` prompt, and v1.22.5 has `_read_existing_env` loading every
  SECRET_VARIABLES entry from .env into the setup first. v1.13.0 is the first
  tag whose wizard reads .env back (checked by walking
  `git tag --sort=v:refname`), so every release from 1.13.0 to 1.22.5 carried it.
