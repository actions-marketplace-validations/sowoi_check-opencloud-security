slug: wizard-existing-secret-permissions
state: draft
ghsa: GHSA-8x9h-vc83-g792
changelog_version: "1.23.2"
changelog_entry: "Existing wizard secret files are private before new secrets are written."
shipped: true
severity: low
cwe_ids:
  - CWE-732
package: web
introduced: "1.9.0"
fixed: "1.23.2"
summary: >-
  Rewriting a broadly readable wizard file exposed new secrets until chmod
verified: |
  git show v1.9.0:docker/setup-wizard.py opens .env with O_CREAT and mode 0600 but only chmods after writing. git show v1.23.1:docker/setup-wizard.py retains that pattern for .env, the nginx admin-secret file and secret backups. os.open's creation mode does not restrict an already existing file.
description: |
  ### Impact
  
  If an existing output or backup file had group/world-readable permissions, rerunning the standalone Docker setup wizard could write fresh credentials while those permissions were still in effect. Another local user able to read the output directory could observe the new secrets before the final chmod. Newly created files already used mode 0600.
  
  ### Patches
  
  Fixed in the source for **1.23.2**. The wizard applies fchmod(0600) to the open descriptor before writing any secret data, including existing .env files, nginx admin-header files and secret backups.
  
  ### Workarounds
  
  Restrict the output directory and all existing secret files to the owner before running the wizard. Rotate any credentials written while other accounts could read those files.
  
  ### Distribution
  
  This affects the web application or its standalone deployment wizard, not the PyPI plugin distribution.
