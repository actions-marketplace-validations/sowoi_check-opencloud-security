summary: >-
  Anonymous scanner probes could disclose the runner's netrc credentials
verified: |
  git show v1.0.1:opencloud_local_scan/scanner.py and git show v1.23.1:opencloud_local_scan/scanner.py both construct requests.Session without disabling trust_env. The same holds for thread-local sessions in v1.23.1. v1.0.1 is the earliest available tag.
description: |
  ### Impact
  
  A scan run by an account with a matching or default .netrc entry could send those credentials to the scanned server without an explicit authentication option. Requests could also replace the scanner's explicit demo Authorization header with netrc credentials. A malicious scan target could collect the credentials. Web deployments are affected if the worker account has such a file.
  
  ### Patches
  
  Fixed in the source for **1.23.2**. Scanner sessions, including parallel sessions, disable ambient Requests configuration. Explicit demo authentication remains intact. Webhook sessions also disable ambient credentials.
  
  ### Workarounds
  
  Run the scanner under a dedicated account without a .netrc file or NETRC configuration. Rotate credentials that may have been sent to an untrusted target.
