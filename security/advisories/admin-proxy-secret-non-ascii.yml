# A security advisory record. See AGENTS.md, "Security advisories".
#
# One file per bullet under a `### Security` heading in CHANGELOG.md.
# `state` is the decision; `verified` is the evidence it rests on.

slug: admin-proxy-secret-non-ascii
state: declined
changelog_version: "1.23.0"
changelog_entry: "A non-ASCII X-COS-Admin-Proxy header is refused with 404 instead of crashing with 500."
shipped: true
declined_because: |
  Hardening. The comparison raised rather than answered, so it failed
  closed: no request was ever admitted that should not have been, and the
  secret stayed exactly as hard to guess. What leaked is one bit - that the
  operator area is switched on - which a deployment's own /admin link, its
  identity provider's redirect and its reverse-proxy configuration already
  reveal to anybody looking.
summary: >-
  A non-ASCII admin proxy secret header raised TypeError, answering 500 where
  a disabled area answers 404
verified: |
  git show v1.22.7:webapp/admin_auth.py:174 - return hmac.compare_digest(presented, expected)
  on two str values; hmac.compare_digest raises TypeError for non-ASCII str.
  webapp/admin_auth.py with that line is present from v1.19.0.
